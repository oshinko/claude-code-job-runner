name: claude-code-job-runner

services:
  runner:
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.220}
        CONTAINER_UID: ${CONTAINER_UID:-10001}
        CONTAINER_GID: ${CONTAINER_GID:-10001}
    image: claude-code-job-runner:${CLAUDE_CODE_VERSION:-2.1.220}
    env_file:
      - path: ${ENV_FILE:-.env}
        required: true
    volumes:
      - package-cache:/home/runner/.cache
    restart: "no"

volumes:
  package-cache:
